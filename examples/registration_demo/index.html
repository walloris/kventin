<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация в Demo ID</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="registration-shell">
    <section class="intro" aria-labelledby="page-title">
      <p class="product-name">Demo ID</p>
      <h1 id="page-title">Создайте аккаунт</h1>
      <p class="intro-copy">Один аккаунт для доступа к тестовому сервису.</p>
      <ul class="benefits" aria-label="Преимущества аккаунта">
        <li>Быстрая регистрация</li>
        <li>Безопасный вход</li>
        <li>Управление профилем</li>
      </ul>
    </section>

    <section class="form-panel" aria-label="Форма регистрации">
      <form id="registration-form" novalidate>
        <div class="field">
          <label for="full-name">Имя и фамилия</label>
          <input id="full-name" name="fullName" data-testid="full-name" autocomplete="name" placeholder="Иван Иванов" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" data-testid="email" type="email" autocomplete="email" placeholder="name@example.com" required>
        </div>

        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" name="password" data-testid="password" type="password" autocomplete="new-password" minlength="8" placeholder="Не менее 8 символов" required>
        </div>

        <label class="agreement" for="terms">
          <input id="terms" name="terms" data-testid="terms" type="checkbox" required>
          <span>Я принимаю условия использования</span>
        </label>

        <button type="submit" data-testid="register-submit">Зарегистрироваться</button>
        <p id="form-status" class="form-status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
